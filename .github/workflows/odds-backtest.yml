# 単勝の期待値バックテスト: 検証期間から無作為に選んだレースの締切時単勝オッズを公式サイトから取得し、
# 「確率 × オッズ」で買った場合の回収率を出す。結果は実行ページの Summary と成果物 odds-backtest に出る。
#
# 公式サイトへの負荷を避けるため、1本ずつ3秒以上あけて取得し、取得済みのオッズは Actions のキャッシュに残す。
# 1回の実行で取れるのは約1,300レース (1件 約12秒 × 270分) なので、2,000レースには2回の実行が要る。
# 起動方法: Actions 画面の Run workflow、または odds-request.txt を変更して push
name: odds-backtest

on:
  push:
    paths:
      - odds-request.txt
  workflow_dispatch:
    inputs:
      cutoff:
        description: "この日より前で学習し、この日以降のレースからオッズを取得する"
        default: "2025-10-01"
      sample:
        description: "オッズを取得するレース数 (無作為抽出)"
        default: "2000"
      budget_minutes:
        description: "オッズの取得に使う時間の上限 (分)"
        default: "270"

permissions:
  contents: read

concurrency:
  group: odds-backtest  # 同時に2本走らせて公式サイトへのアクセスが倍にならないように
  cancel-in-progress: false

jobs:
  odds-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore data cache (read only)
        uses: actions/cache/restore@v4
        with:
          path: data
          key: boatrace-data-odds-${{ github.run_id }}
          restore-keys: boatrace-data-
          fail-on-cache-miss: true

      - name: Restore odds cache
        uses: actions/cache/restore@v4
        with:
          path: odds_cache
          key: boatrace-odds-${{ github.run_id }}
          restore-keys: boatrace-odds-

      - run: mkdir -p odds_cache  # 1件も取れなかった場合もキャッシュの保存で失敗しないように

      - name: Resolve parameters
        id: params
        env:
          IN_CUTOFF: ${{ inputs.cutoff }}
          IN_SAMPLE: ${{ inputs.sample }}
          IN_BUDGET: ${{ inputs.budget_minutes }}
        run: |
          CUTOFF="$IN_CUTOFF"; SAMPLE="$IN_SAMPLE"; BUDGET="$IN_BUDGET"
          if [ -f odds-request.txt ] && [ -z "$CUTOFF" ]; then
            CUTOFF=$(sed -n 's/^cutoff=//p' odds-request.txt | tr -d '[:space:]')
            SAMPLE=$(sed -n 's/^sample=//p' odds-request.txt | tr -d '[:space:]')
            BUDGET=$(sed -n 's/^budget_minutes=//p' odds-request.txt | tr -d '[:space:]')
          fi
          CUTOFF=${CUTOFF:-2025-10-01}; SAMPLE=${SAMPLE:-2000}; BUDGET=${BUDGET:-270}
          # 値はコマンドに渡すので形式を確かめる。取得数と時間には上限を設ける
          [[ "$CUTOFF" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "cutoff の形式が不正: $CUTOFF"; exit 1; }
          [[ "$SAMPLE" =~ ^[0-9]{1,4}$ ]] && [ "$SAMPLE" -le 3000 ] || { echo "sample は 3000 以下: $SAMPLE"; exit 1; }
          [[ "$BUDGET" =~ ^[0-9]{1,3}$ ]] && [ "$BUDGET" -le 300 ] || { echo "budget_minutes は 300 以下: $BUDGET"; exit 1; }
          {
            echo "cutoff=$CUTOFF"; echo "sample=$SAMPLE"; echo "budget=$BUDGET"
          } >> "$GITHUB_OUTPUT"
          echo "cutoff=$CUTOFF sample=$SAMPLE budget_minutes=$BUDGET"

      - name: Fetch odds (one at a time, within the time budget)
        env:
          BOATRACE_ODDS_DIR: odds_cache
          CUTOFF: ${{ steps.params.outputs.cutoff }}
          SAMPLE: ${{ steps.params.outputs.sample }}
          BUDGET: ${{ steps.params.outputs.budget }}
        run: python -m boatrace.cli odds-fetch --cutoff "$CUTOFF" --sample "$SAMPLE" --budget-minutes "$BUDGET"

      - name: Save odds cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: odds_cache
          key: boatrace-odds-${{ github.run_id }}

      - name: EV backtest
        env:
          BOATRACE_ODDS_DIR: odds_cache
          CUTOFF: ${{ steps.params.outputs.cutoff }}
        run: |
          python -m boatrace.cli ev-backtest --cutoff "$CUTOFF" --report report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odds-backtest
          path: |
            report.md
            odds_cache
