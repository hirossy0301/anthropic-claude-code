# 毎朝の更新: 公式データと気温を取り込み、直近の特徴量を serve/ に書き出してコミットする。
# 3年分の DB は大きくリポジトリに置けないため、Actions のキャッシュで実行間に引き継ぐ。
# キャッシュが無い (初回・7日以上未使用で消えた) 場合は3年分を取り直す (約3時間)。
name: daily-update

on:
  schedule:
    # GitHub の定期実行は混雑時に遅れたり飛ばされたりする (2026-10-03 は 06:17 の回が実行されなかった)。
    # 毎時0分・30分を避け、朝に3回置いて、どれかが飛ばされても次の回で取り戻せるようにする
    - cron: "47 20 * * *"  # 毎日 05:47 JST
    - cron: "47 21 * * *"  # 毎日 06:47 JST
    - cron: "17 0 * * *"   # 毎日 09:17 JST (朝の時点で番組表が未公開だった場合の取り直し)
  workflow_dispatch:
    inputs:
      retrain:
        description: "モデルを再学習する"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore data cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: boatrace-data-${{ github.run_id }}
          restore-keys: boatrace-data-

      - name: Seed 3 years of data (no cache)
        if: steps.cache.outputs.cache-matched-key == ''
        run: |
          START=$(TZ=Asia/Tokyo date -d "3 years ago" +%F)
          END=$(TZ=Asia/Tokyo date +%F)
          python -m boatrace.cli download --start "$START" --end "$END" --workers 3
          python -m boatrace.cli ingest
          python -m boatrace.cli weather --start "$START" --end "$END"

      - name: Daily update
        run: python -m boatrace.cli daily

      - name: Retrain models (weekly, first run, or on request)
        env:
          SEEDED: ${{ steps.cache.outputs.cache-matched-key == '' }}
          REQUESTED: ${{ inputs.retrain == true }}
        run: |
          # 週1回、月曜 (日本時間) の最初に動いた回で再学習する。その日すでに学習済みなら同じ日の後の回では学習しない
          WEEKLY=false
          TODAY=$(TZ=Asia/Tokyo date +%F)
          TRAINED_ON=$(cat serve/trained_on.txt 2>/dev/null || echo none)
          if [ "$(TZ=Asia/Tokyo date +%u)" = "1" ] && [ "$TRAINED_ON" != "$TODAY" ]; then WEEKLY=true; fi
          # モデルの作り方が変わった (serve/model_version.txt がコードの MODEL_VERSION と違う) ときも再学習する
          CODE_VERSION=$(python -c "from boatrace import config; print(config.MODEL_VERSION)")
          SERVED_VERSION=$(cat serve/model_version.txt 2>/dev/null || echo none)
          if [ "$SEEDED" = "true" ] || [ "$REQUESTED" = "true" ] || [ "$WEEKLY" = "true" ] \
             || [ ! -f serve/model_morning.pkl ] || [ "$CODE_VERSION" != "$SERVED_VERSION" ]; then
            python -m boatrace.cli train --out-dir serve
            echo "$TODAY" > serve/trained_on.txt
          else
            echo "skip retrain"
          fi

      # EV 買いの記録 (Supabase)。Secrets に SUPABASE_URL / SUPABASE_SECRET_KEY があるときだけ動く。
      # 失敗しても毎日の更新は止めない
      - name: Paper trading on Supabase (settle yesterday, plan today)
        if: env.SUPABASE_URL != ''
        continue-on-error: true
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python -m boatrace.cli paper-settle
          python -m boatrace.cli paper-plan

      - name: Drop downloaded archives (already extracted)
        if: always()
        run: rm -rf data/lzh

      - name: Save data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: boatrace-data-${{ github.run_id }}

      - name: Commit serve/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add serve
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Update serve data $(TZ=Asia/Tokyo date '+%F %H:%M') JST"
            git pull --rebase origin "${GITHUB_REF_NAME}"  # 実行中に別のコミットが入っていても push できるように
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
